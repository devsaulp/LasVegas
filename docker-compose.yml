services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lasvegas-app
    restart: unless-stopped
    networks:
      - web

  db:
    image: mysql:8.4
    container_name: lasvegas-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: lasvegas
      MYSQL_USER: lasvegas
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - web

volumes:
  db_data:

networks:
  web:
    external: true
