<!DOCTYPE html>
<html lang="es-PE" data-roles="administrador cajero">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tablero | Panel Las Vegas</title>
  <link rel="icon" href="../assets/img/logo-provisional.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/admin/sesion.js"></script>
</head>
<body data-raiz="../" data-pagina="tablero" data-titulo="Tablero">
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <div class="panel">
    <aside class="menu-lateral" id="menu-lateral" aria-label="Menú del panel"></aside>
    <div class="panel__principal">
      <header class="barra-superior" id="barra-superior"></header>
      <main id="contenido">
        <div class="contenedor">
          <div class="encabezado-pagina">
            <div>
              <h1>Tablero</h1>
              <p id="saludo"></p>
            </div>
            <a class="btn btn--secundario" href="pedidos.html">Ver pedidos</a>
          </div>
          <p class="aviso aviso--alerta aviso-demo">Panel de demostración: los datos son de ejemplo y los cambios se guardan solo en este navegador.</p>
          <section aria-label="Resumen del día">
            <div class="tarjetas-resumen" id="tarjetas-resumen"></div>
          </section>
          <section class="seccion" aria-labelledby="titulo-ultimos">
            <div class="seccion__cabecera">
              <h2 id="titulo-ultimos">Últimos pedidos</h2>
              <a href="pedidos.html">Ver todos</a>
            </div>
            <ul class="lista-pedidos" id="ultimos-pedidos"><li>Cargando pedidos...</li></ul>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/negocio.js"></script>
  <script src="../assets/js/utilidades.js"></script>
  <script src="../assets/js/admin/panel.js"></script>
  <script src="../assets/js/admin/tablero.js"></script>
</body>
</html>
