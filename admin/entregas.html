<!DOCTYPE html>
<html lang="es-PE" data-roles="repartidor">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mis entregas | Panel Las Vegas</title>
  <link rel="icon" href="../assets/img/logo-provisional.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/componentes.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/admin/sesion.js"></script>
</head>
<body data-raiz="../" data-pagina="entregas" data-titulo="Mis entregas">
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <div class="panel">
    <aside class="menu-lateral" id="menu-lateral" aria-label="Menú del panel"></aside>
    <div class="panel__principal">
      <header class="barra-superior" id="barra-superior"></header>
      <main id="contenido">
        <div class="contenedor">
          <div class="encabezado-pagina">
            <div>
              <h1>Mis entregas</h1>
              <p id="resumen-entregas"></p>
            </div>
          </div>
          <div class="aviso aviso--info">
            <p><strong>Antes de entregar:</strong> pide el documento de identidad. Si la persona no es mayor de 18 años, no entregues el pedido y avisa a la tienda.</p>
          </div>
          <section class="seccion" aria-labelledby="titulo-pendientes">
            <div class="seccion__cabecera"><h2 id="titulo-pendientes">Por entregar</h2></div>
            <div class="lista-entregas" id="entregas-pendientes"><p>Cargando entregas...</p></div>
          </section>
          <section class="seccion" aria-labelledby="titulo-entregadas">
            <div class="seccion__cabecera"><h2 id="titulo-entregadas">Entregadas hoy</h2></div>
            <div class="lista-entregas" id="entregas-hechas"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/negocio.js"></script>
  <script src="../assets/js/utilidades.js"></script>
  <script src="../assets/js/admin/panel.js"></script>
  <script src="../assets/js/admin/entregas.js"></script>
</body>
</html>
